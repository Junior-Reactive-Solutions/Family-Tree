name: Keep API awake

# Render's free plan sleeps after ~15 minutes without traffic, so the first visitor
# afterwards waits up to a minute. A light ping every 10 minutes keeps it warm.
# /api/health does not touch the database, so Neon can still sleep and save hours.
# Note: GitHub may delay scheduled runs at busy times, and disables schedules on public
# repos after 60 days with no commits. Re-enable from the Actions tab if that happens.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        env:
          URL: https://family-tree-api-1zfh.onrender.com/api/health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 60 "$URL" || echo 000)
            echo "attempt $attempt: HTTP $code $(head -c 100 /tmp/body 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::API health check failed after 3 attempts"
          exit 1
